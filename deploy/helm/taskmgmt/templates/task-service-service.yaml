apiVersion: v1
kind: Service
metadata:
  name: task-service
  labels:
    app: task-service
spec:
  type: {{ .Values.taskService.service.type }}
  selector:
    app: task-service
  ports:
    - name: http
      port: {{ .Values.taskService.service.port }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.taskService.grpcPort }}
      targetPort: {{ .Values.taskService.grpcPort }}
      protocol: TCP